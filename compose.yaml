# ==============================================================================
# CampusNode — Docker Compose (Local Testing & Development)
# Exactly four primary services: postgres, redis, backend, frontend
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: campusnode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusnode}
      POSTGRES_USER: ${POSTGRES_USER:-campusnode_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD is required in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusnode_user} -d ${POSTGRES_DB:-campusnode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusnode-network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Cache & BullMQ Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: campusnode-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Error: REDIS_PASSWORD is required in .env}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - campusnode-network

  # ----------------------------------------------------------------------------
  # 2.5 Prisma Migration Runner (Executes 'prisma migrate deploy' once on startup)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: campusnode-backend:latest
    container_name: campusnode-migration
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?Error: DATABASE_URL is required in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campusnode-network

  # ----------------------------------------------------------------------------
  # 3. Node.js Express Backend (API, WebSockets, Embedded BullMQ Worker)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: campusnode-backend:latest
    container_name: campusnode-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: "${DATABASE_URL:?Error: DATABASE_URL is required in .env}"
      REDIS_URL: "${REDIS_URL:?Error: REDIS_URL is required in .env}"
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET is required in .env}"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-CampusNode <no-reply@campusnode.nitj.ac.in>}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CampusNode Support}
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - campusnode-network

  # ----------------------------------------------------------------------------
  # 4. React 19 Frontend SPA & Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    image: campusnode-frontend:latest
    container_name: campusnode-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - campusnode-network

  # ----------------------------------------------------------------------------
  # 5. Mailpit Local SMTP Server & Web Inspection Mailbox
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: campusnode-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - campusnode-network

  # ----------------------------------------------------------------------------
  # 6. Adminer — PostgreSQL Web Browser (Local Development Only)
  #    Access at http://localhost:8081
  #    Do NOT add to compose.production.yaml
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: campusnode-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campusnode-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: campusnode_postgres_data
  redis_data:
    name: campusnode_redis_data

# ------------------------------------------------------------------------------
# Isolated Internal Network
# ------------------------------------------------------------------------------
networks:
  campusnode-network:
    name: campusnode-network
    driver: bridge
