<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="theme-color" id="theme-color-meta" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampusNode" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" id="dynamic-favicon" type="image/png" href="/lightthemelogo2.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <script>
      // Helper to dynamically round the favicon using HTML Canvas
      window.setRoundedFavicon = function(src) {
        const favicon = document.getElementById('dynamic-favicon');
        if (!favicon) return;
        const img = new Image();
        img.src = src;
        img.onload = function() {
          try {
            const canvas = document.createElement('canvas');
            const size = Math.min(img.width, img.height) || 64;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Create circular clipping path
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            
            // Draw image centered and scaled
            ctx.drawImage(img, 0, 0, size, size);
            
            favicon.href = canvas.toDataURL('image/png');
          } catch (e) {
            // Fallback to unrounded image if canvas clipping fails
            favicon.href = src;
          }
        };
        img.onerror = function() {
          favicon.href = src;
        };
      };

      // FOUC prevention — apply dark class and set theme-color before React mounts
      (function(){
        try {
          const theme = localStorage.getItem('theme');
          const isDark = theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if(isDark) document.documentElement.classList.add('dark');
          
          const targetColor = isDark ? '#0a0a0a' : '#ffffff';
          const metas = document.querySelectorAll("meta[name='theme-color']");
          metas.forEach(function(m) {
            m.setAttribute('content', targetColor);
          });

          // Set initial rounded favicon
          const faviconSrc = isDark ? '/darkthemelogo.png' : '/lightthemelogo2.png';
          window.setRoundedFavicon(faviconSrc);
        } catch(e){}
      })();
    </script>
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preload" href="/fonts/organix.regular.otf" as="font" type="font/otf" crossorigin />
    <style>
      @font-face {
        font-family: 'logofont';
        src: url('/fonts/organix.regular.otf') format('opentype');
        font-display: swap;
      }
    </style>
    <title>CampusNode</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React Modern AI Shimmer Loader — replaced when React mounts -->
      <div id="pre-loader" role="status" aria-label="Loading" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background 0.3s ease;">
        <style>
          @keyframes preShimmerSweep {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
          }
          .pre-shimmer {
            display: inline-block;
            background-image: linear-gradient(90deg, rgba(15,23,42,0.35) 0%, rgba(15,23,42,0.35) 30%, rgba(15,23,42,0.98) 50%, rgba(15,23,42,0.35) 70%, rgba(15,23,42,0.35) 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: preShimmerSweep 1.8s ease-in-out infinite;
            user-select: none;
            font-family: Inter, system-ui, -apple-system, sans-serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.05em;
          }
          html.dark .pre-shimmer {
            background-image: linear-gradient(90deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.32) 30%, rgba(255,255,255,0.98) 50%, rgba(255,255,255,0.32) 70%, rgba(255,255,255,0.32) 100%);
          }
          @media (prefers-reduced-motion: reduce) {
            .pre-shimmer {
              animation: none !important;
              background-image: none !important;
              -webkit-text-fill-color: currentColor !important;
              color: #4b5563 !important;
            }
            html.dark .pre-shimmer {
              color: #9ca3af !important;
            }
          }
        </style>
        <script>document.getElementById('pre-loader').style.background=document.documentElement.classList.contains('dark')?'#0a0a0a':'#ffffff';</script>
        <div style="position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(234,88,12,0.08) 0%,transparent 70%);filter:blur(50px);pointer-events:none;"></div>
        <div style="text-align:center;position:relative;z-index:1;">
          <div id="pre-brand" style="font-family:'logofont',serif;font-size:28px;font-weight:700;letter-spacing:0.04em;margin-bottom:12px;">Campus<span style="color:#ea580c;font-weight:300;">Node</span></div>
          <span class="pre-shimmer">Loading...</span>
          <script>
            (function(){
              var dk=document.documentElement.classList.contains('dark');
              document.getElementById('pre-brand').style.color=dk?'#ffffff':'#0a0a0a';
            })();
          </script>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
